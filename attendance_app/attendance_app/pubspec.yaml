name: attendance_app
description: A face-verified, geofenced employee attendance app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4

  # Camera + face detection
  camera: ^0.11.0+2
  google_mlkit_face_detection: ^0.11.1

  # Location / geofencing
  geolocator: ^13.0.1
  permission_handler: ^11.3.1

  # Utilities
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
