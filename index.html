<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Attendance Verification System</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 {
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 14px;
            color: #555;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            margin-bottom: 15px;
            transition: background 0.2s;
        }
        .btn-in {
            background-color: #27ae60;
        }
        .btn-in:hover {
            background-color: #219653;
        }
        .btn-out {
            background-color: #c0392b;
        }
        .btn-out:hover {
            background-color: #a93226;
        }
        #statusMessage {
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
            padding: 10px;
            border-radius: 6px;
            background: #f8f9fa;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Attendance Portal</h2>
        
        <div class="input-group">
            <label for="empId">Employee ID:</label>
            <input type="text" id="empId" placeholder="e.g., EMP001" value="EMP001">
        </div>

        <button class="btn btn-in" onclick="handleAttendance('CHECK_IN')">SIGN IN</button>
        <button class="btn btn-out" onclick="handleAttendance('CHECK_OUT')">SIGN OUT</button>

        <div id="statusMessage">Please select an action above.</div>
    </div>

    <script>
        function handleAttendance(actionType) {
            const empId = document.getElementById('empId').value.trim();
            const statusBox = document.getElementById('statusMessage');

            if (!empId) {
                statusBox.style.color = '#c0392b';
                statusBox.innerText = 'Error: Please enter your Employee ID.';
                return;
            }

            statusBox.style.color = '#2980b9';
            statusBox.innerText = 'Checking GPS coordinates (Geofence)...';

            // Simulate GPS Check & Camera Verification process flow
            setTimeout(() => {
                const simulatedDistance = 15; // Simulated distance in meters from office
                const allowedRadius = 50;

                if (simulatedDistance <= allowedRadius) {
                    statusBox.style.color = '#27ae60';
                    statusBox.innerText = `Location Verified (${simulatedDistance}m away). Simulating Camera Snapshot & Database Sync...`;
                    
                    setTimeout(() => {
                        statusBox.innerText = `Success! ${actionType} recorded for ${empId}.`;
                    }, 1500);
                } else {
                    statusBox.style.color = '#c0392b';
                    statusBox.innerText = 'Access Denied: You are outside the 50m office boundary.';
                }
            }, 1000);
        }
    </script>

</body>
</html>
